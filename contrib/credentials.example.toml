# ~/.config/remote-control/credentials.toml  (must be chmod 600)
# How to fill this in: docs/tuya-setup.md

# Data center of your Tuya cloud project. Brazil: "us" (Western America).
region = "us"

# Cloud project > Overview > Authorization Key.
access_id = ""
access_secret = ""

# One table per device id from config.toml.
[remotes.ac]
infrared_id = ""   # Device ID of the IR blaster (Devices tab of the cloud project)
remote_id = ""     # run: rc tuya remotes
